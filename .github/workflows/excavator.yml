on:
  schedule:
    # Daily. Metrolist releases in bursts, not hourly — no reason to poll harder.
    - cron: '15 6 * * *'
  workflow_dispatch:
name: Excavator
permissions:
  contents: write
jobs:
  excavate:
    name: Excavator
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - name: Excavator
      uses: ScoopInstaller/GithubActions@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SKIP_UPDATED: '1'
